nimbus.oidc {
  # Keycloak issuer URL format: {server-root}/realms/{realm-name}
  issuer        = "http://localhost:8080/realms/play-dev"
  client_id     = "play-dev"
  
  # Paste the secret you copied from the Keycloak Clients -> Credentials tab
  client_secret = "TODO_CHANGEME"
  
  callback_url  = "http://localhost:9000/oidc/callback"
  
  post_login_url  = "/"
  post_logout_url = "/"
}
