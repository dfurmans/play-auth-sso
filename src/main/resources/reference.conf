# Register the Guice module automatically.
play.modules.enabled += "io.ellatech.dfurmans.NimbusModule"

nimbus.oidc {
  # Issuer URL. Discovery runs at {issuer}/.well-known/openid-configuration.
  issuer = ""

  # Client credentials registered with the IdP.
  client_id = "play-dev"
  # The secret has no default: set it here or via the OIDC_CLIENT_SECRET env var.
  client_secret = ""
  client_secret = ${?OIDC_CLIENT_SECRET}

  # Absolute callback URL registered with the IdP (the host's /oidc/callback).
  callback_url = ""

  # Where to send the browser after a successful login / after logout.
  post_login_url = "/"
  post_logout_url = "/"

  # OIDC scopes requested at login.
  scopes = ["openid", "profile", "email"]

  # ID-token claims copied into the Play session by the default SessionCreator
  # (the subject is always stored under "sub").
  session_claims = ["email", "name"]

  # How long the default in-memory store keeps the ID token used as the
  # id_token_hint at logout. Should be at least the session lifetime.
  id_token_ttl = 8 hours
}

# Dedicated pool for blocking IdP calls (discovery, token exchange, JWKS fetch)
# so they never run on Play's default dispatcher.
nimbus.blocking-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 16
  }
  throughput = 1
}
