# Register the Guice module automatically.
play.modules.enabled += "io.ellatech.dfurmans.NimbusModule"

nimbus.oidc {
  # Issuer URL. Discovery runs at {issuer}/.well-known/openid-configuration.
  issuer = ""

  # Client credentials registered with the IdP.
  client_id = ""
  client_secret = ""

  # Absolute callback URL registered with the IdP (the host's /oidc/callback).
  callback_url = ""

  # Where to send the browser after a successful login / after logout.
  post_login_url = "/"
  post_logout_url = "/"

  # OIDC scopes requested at login.
  scopes = ["openid", "profile", "email"]

  # ID-token claims copied into the Play session by the default SessionCreator
  # (the subject is always stored under "sub").
  session_claims = ["email", "name"]
}
