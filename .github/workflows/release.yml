name: Release

on:
  push:
    branches: ["main", "feature/*"]
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25' # Note: Java 21 is currently the standard LTS, consider switching to 21 if you face JVM issues

      - uses: sbt/setup-sbt@v1

      # Run tests on every push (main, features, and tags)
      - name: Test
        run: sbt test

      # ONLY run the publish step if the push is a Tag (e.g., v0.0.1)
      - name: Publish (CI Release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: sbt -debug ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

